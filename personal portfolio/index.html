<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <!-- Animated Headline -->
        <div class="headline">

            <p class="small-text">HELLO, I'M</p>

            <h1>
                AMAY <span>SENAPATI</span>
            </h1>

            <div class="typing">
                <span id="typing-text"></span>
                <span class="cursor">|</span>
            </div>

        </div>


        <!-- Animated MP4 Character -->
        <div class="character">

            <div class="glow"></div>

            <video
                src="hii.mp4"
                autoplay
                muted
                loop
                playsinline>
            </video>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
